<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S Chat</title>

    <link rel="stylesheet" href="chatroom.css">
    
<style>
  
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
    display:flex;
    flex-direction:column;
    height:100vh;
}

/* Top Bar */

.topBar{
    display:flex;
    align-items:center;
    gap:15px;
    padding:15px;
    background:#1b1b1b;
    border-bottom:1px solid #333;
}

#backBtn{
    background:none;
    border:none;
    color:white;
    font-size:50px;
    cursor:pointer;
    margin-left: -6px;
    margin-top: -20px;
}

.userInfo{
    display:flex;
    align-items:center;
    gap:12px;
}

.profilePic {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #4FC3F7;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: auto;
}

.profilePic img {
    width: 45px;
    height: 45px;
    filter: brightness(0) invert(1);
}

#friendName{
    font-size:18px;
    margin-bottom:3px;
}

#friendStatus{
    font-size:13px;
    color:#aaa;
}

/* Messages */

#chatMessages{

    flex:1;

    overflow-y:auto;

    padding:16px;

    display:flex;

    flex-direction:column;

    gap:10px;

}
/* Message Box */

.messageBox{
    display:flex;
    gap:10px;
    padding:12px;
    background:#1b1b1b;
    border-top:1px solid #333;
}

#messageInput{

    flex:1;

    height:48px;

    padding:0 18px;

    border:1px solid #404040;

    border-radius:28px;

    background:#202020;

    color:#fff;

    outline:none;

    font-size:15px;

    font-weight:500;

    transition:.25s;

}

#messageInput:focus{

    border-color:#38bdf8;

}
#sendBtn{

    width:50px;
    height:50px;

    border:none;

    border-radius:50%;

    background:linear-gradient(135deg,#38bdf8,#2563eb);

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    transition:.2s;

    box-shadow:0 8px 18px rgba(37,99,235,.35);

}

#sendBtn:active{

    transform:scale(.93);

}
.menuContainer {
    
    position: relative;
    margin-left: auto;
    
}

#menuBtn {
    
    background: none;
    border: none;
    color: white;
    font-size: 28px;
    cursor: pointer;
    
}

.popupMenu {
    
    display: none;
    
    position: absolute;
    right: 0;
    top: 40px;
    
    background: #1f1f1f;
    
    border-radius: 10px;
    
    min-width: 170px;
    
    overflow: hidden;
    
    box-shadow: 0 0 10px rgba(0, 0, 0, .4);
    
    z-index: 999;
    
}

.menuItem {
    
    padding: 14px;
    
    cursor: pointer;
    
    border-bottom: 1px solid #333;
    
}

.menuItem:last-child {
    
    border-bottom: none;
    
}

.menuItem:active {
    
    background: #333;
    
}

</style>
</head>
<body>

    <!-- Top Bar -->
    <header class="topBar">

        <button id="backBtn">←</button>

        <div class="userInfo">

<div class="profilePic">
    <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/person-circle.svg" alt="Profile">
</div>

            <div>

                <h3 id="friendName">
                    Loading...
                </h3>

                <p id="friendStatus">
                    Offline
                </p>
                
            </div>

        </div>
        
       <div style="display:flex;align-items:center;margin-left:auto;gap:15px;">

<button id="callBtn"
style="
background:none;
border:none;
color:white;
font-size:25px;
cursor:pointer;
">
📞
</button>

<div class="menuContainer">

<button id="menuBtn">
⋮
</button>

<div id="popupMenu" class="popupMenu">

<div id="blockUserBtn" class="menuItem">
🚫 Block User
</div>

</div>

</div>

</div>

    </header>

    <!-- Messages -->

    <div id="chatMessages">

        <!-- Messages yahan aayenge -->

    </div>

    <!-- Message Box -->

    <div class="messageBox">

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
        >

<button id="sendBtn">

<svg xmlns="http://www.w3.org/2000/svg"
width="22"
height="22"
viewBox="0 0 24 24"
fill="white">

<path d="M3.4 20.4L22 12L3.4 3.6L3.3 10.2L16 12L3.3 13.8L3.4 20.4Z"/>

</svg>

</button>
    </div>

    <script type="module" src="chatroom.js"></script>

</body>
</html>

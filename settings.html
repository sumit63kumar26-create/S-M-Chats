<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Settings</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f0f0f;
color:white;
}

.header{
height:60px;
display:flex;
align-items:center;
padding:0 15px;
background:#1b1b1b;
border-bottom:1px solid #333;
}

.backBtn{
font-size:50px;
cursor:pointer;
margin-right:15px;
margin-top: -20px;
}

.title{
font-size:22px;
font-weight:bold;
}

.container{
padding:15px;
}

.card{

background:#1e1e1e;
border-radius:12px;
padding:18px;
margin-bottom:15px;
cursor:pointer;
transition:.2s;

}

.card:active{

transform:scale(.98);

}

.cardTitle{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:15px;
    font-weight:800;
    
}

.cardTitle svg{
    width:22px;
    height:22px;
    flex-shrink:0;
    display:block;
}

.logout{

margin-top:40px;
background:#F02525;
text-align:center;
justify-items:center;
font-weight:bold;

}

.logout:active{

background:#b71c1c;

}

</style>

</head>

<body>

<div class="header">

<div class="backBtn"
id="backBtn">
←
</div>

<div class="title">
Settings
</div>

</div>

<div class="container">

<div class="card"
id="friendsCard">

<div class="cardTitle">

<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
viewBox="0 0 24 24" fill="none" stroke="#4FC3F7"
stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
<circle cx="9" cy="7" r="4"/>
<path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
<path d="M16 3.13a4 4 0 0 1 0 7.75"/>

</svg>

Friends (<span id="friendsCount">0</span>)

</div>

</div>

<div class="card"
id="blockedCard">

<div class="cardTitle">

<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
viewBox="0 0 24 24" fill="none" stroke="#EF5350"
stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

<circle cx="12" cy="12" r="9"/>
<path d="M7 7l10 10"/>

</svg>

Blocked Users (<span id="blockedCount">0</span>)

</div>

</div>

<div class="card"
id="notificationCard">

<div class="cardTitle">

<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
viewBox="0 0 24 24" fill="none" stroke="#FFD54F"
stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

<path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
<path d="M13.73 21a2 2 0 0 1-3.46 0"/>

</svg>

Notifications

</div>

</div>

<div class="card"
id="advancedCard">

<div class="cardTitle">

<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
viewBox="0 0 24 24" fill="none" stroke="#00E676"
stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

<path d="M13 2L3 14h7l-1 8 10-12h-7z"/>

</svg>

Advanced Features

</div>

</div>

<div class="card"
id="aboutCard">

<div class="cardTitle">

<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
viewBox="0 0 24 24" fill="none" stroke="#29B6F6"
stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

<circle cx="12" cy="12" r="10"/>
<path d="M12 16v-4"/>
<circle cx="12" cy="8" r="1"/>

</svg>

About

</div>

</div>

<div class="card logout"
id="logoutBtn">

<div class="cardTitle">

 Logout

</div>

</div>

</div>

<script type="module"
src="settings.js">
</script>

</body>
</html>

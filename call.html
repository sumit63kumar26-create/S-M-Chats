  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Calling</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#0f0f0f;

color:white;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.container{

text-align:center;

}

.profile{

width:120px;

height:120px;

border-radius:50%;

background:#38bdf8;

display:flex;

justify-content:center;

align-items:center;

margin:auto;

margin-bottom:20px;

}

.profile img{

width:70px;

filter:brightness(0) invert(1);

}

#callerName{

font-size:26px;

font-weight:bold;

margin-bottom:10px;

}

#callStatus{

color:#cbd5e1;

font-size:16px;

margin-bottom:80px;

}

.endBtn{

width:80px;

height:80px;

border:none;

border-radius:50%;

background:#ef4444;

font-size:34px;

cursor:pointer;

}

.endBtn:active{

transform:scale(.92);

}

</style>

</head>

<body>

<div class="container">

<div class="profile">

<img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/person-circle.svg">

</div>

<h2 id="callerName">

Loading...

</h2>

<p id="callStatus">

Calling...

</p>

<button
class="endBtn"
id="endCall">

📞

</button>

</div>

<script type="module" src="call.js"></script>

</body>
</html>
